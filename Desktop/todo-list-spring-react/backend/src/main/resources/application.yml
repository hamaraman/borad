spring:
  application:
    name: haru-backend
  profiles:
    default: dev
  jackson:
    time-zone: Asia/Seoul
  web:
    resources:
      static-locations: classpath:/static/,file:${app.frontend.path:./dist/public}/

server:
  port: ${PORT:${BACKEND_PORT:8080}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend:
    path: ${FRONTEND_PATH:./dist/public}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:todolist;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres?user=postgres.skwrrvyszgbrmmawedta&sslmode=require}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres.skwrrvyszgbrmmawedta}
    password: ${SPRING_DATASOURCE_PASSWORD:gkfka959323@}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
